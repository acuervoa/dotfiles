name: ci-integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  external-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fzf gawk

      - name: Install Neovim
        run: |
          nvim_version=v0.11.6
          curl -fsSL "https://github.com/neovim/neovim/releases/download/${nvim_version}/nvim-linux-x86_64.tar.gz" -o /tmp/nvim.tar.gz
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "LUA_PATH=$GITHUB_WORKSPACE/stow/nvim/.config/nvim/lua/?.lua;$GITHUB_WORKSPACE/stow/nvim/.config/nvim/lua/?/init.lua;;" >> "$GITHUB_ENV"

      - name: Install ble.sh
        run: |
          git clone --branch v0.4.0-devel3 --depth 1 https://github.com/akinomyoga/ble.sh.git /tmp/ble.sh
          sudo make -C /tmp/ble.sh install PREFIX=/usr

      - name: Install Neovim plugins
        run: |
          nvim --headless --cmd "set rtp^=$PWD/stow/nvim/.config/nvim" -u "$PWD/stow/nvim/.config/nvim/init.lua" '+Lazy! sync' '+qa'

      - name: Application release gate
        run: bash ./tests/application_release_gate_test.sh

      - name: Neovim runtime contracts
        run: |
          bash ./tests/nvim_keymap_test.sh
          bash ./tests/nvim_lsp_health_contract_test.sh
          bash ./tests/nvim_workflow_contract_test.sh

      - name: ble.sh integration contract
        run: bash ./tests/blesh_integration_test.sh
