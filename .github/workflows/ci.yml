name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      include_untracked:
        description: "Run secrets scan on untracked files"
        required: false
        default: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt ripgrep neovim fzf gawk

      - name: Install ble.sh
        run: |
          git clone --branch v0.4.0-devel3 --depth 1 https://github.com/akinomyoga/ble.sh.git /tmp/ble.sh
          sudo make -C /tmp/ble.sh install PREFIX=/usr

      - name: Repo checks
        run: bash ./scripts/check.sh

      - name: Desktop config checks
        run: bash ./scripts/check-desktop-configs.sh --static

      - name: Desktop config tests
        run: bash ./tests/config_checks_test.sh

      - name: Application release gate
        run: bash ./tests/application_release_gate_test.sh

      - name: Full test suite
        run: bash ./scripts/run_tests.sh

      - name: Neovim static config check
        run: bash ./scripts/check-nvim.sh --static

      - name: Secret scan (tracked files)
        run: bash ./scripts/check-secrets.sh

      - name: Secret scan (include untracked)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_untracked == 'true' }}
        run: bash ./scripts/check-secrets.sh --all

  bootstrap-smoke:
    runs-on: ubuntu-latest
    # Runs a real (non-dry-run) bootstrap against a pristine, isolated HOME
    # to catch structural stow issues -- malformed package layouts, a group
    # renamed without updating a host profile, etc. -- that static lint alone
    # won't. It won't catch drift on an already-lived-in machine (nothing
    # here pre-exists to conflict with), only that a fresh bootstrap resolves
    # cleanly end to end.
    env:
      HOME: /tmp/dotfiles-bootstrap-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stow
        run: |
          sudo apt-get update
          sudo apt-get install -y stow

      - name: Bootstrap into an isolated HOME
        run: |
          mkdir -p "$HOME"
          bash ./scripts/bootstrap.sh -y --skip-tmux-plugins

      - name: Doctor must report zero conflicts after bootstrap
        run: bash ./scripts/doctor.sh --no-lint
