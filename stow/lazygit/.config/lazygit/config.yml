# Configuración mínima para alinear lazygit con las convenciones de Git del repo.
# Documentación: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

git:
  # Detecta correctamente la rama principal al sincronizar/limpiar.
  mainBranches:
    - main
    - master
  # Respeta los hooks centralizados configurados mediante core.hooksPath.
  hooksPath: ~/.git-hooks
  # Evita que lazygit cree ramas base usando remotos distintos.
  mainRemote: origin

ui:
  # Mantiene consistente el estilo de confirmaciones (no interferir con hooks interactivos).
  confirmOnQuit: true

# Catppuccin Mocha (catppuccin/lazygit, accent blue — misma variante que kitty/atuin/gh-dash).
theme:
  activeBorderColor:
    - '#89b4fa'
    - bold
  inactiveBorderColor:
    - '#a6adc8'
  searchingActiveBorderColor:
    - '#f9e2af'
  optionsTextColor:
    - '#89b4fa'
  selectedLineBgColor:
    - '#313244'
  inactiveViewSelectedLineBgColor:
    - '#6c7086'
  cherryPickedCommitFgColor:
    - '#89b4fa'
  cherryPickedCommitBgColor:
    - '#45475a'
  markedBaseCommitFgColor:
    - '#89b4fa'
  markedBaseCommitBgColor:
    - '#f9e2af'
  unstagedChangesColor:
    - '#f38ba8'
  defaultFgColor:
    - '#cdd6f4'

authorColors:
  '*': '#b4befe'

# Reutiliza las funciones guardadas de stow/bash/.bash_lib/git.sh en vez de
# reimplementar la lógica aquí (mismo owner: Git; dos superficies de acceso).
customCommands:
  - key: '<c-w>'
    context: 'files'
    description: 'WIP commit (guarded, via bash wip())'
    command: "bash -ic 'wip'"
    subprocess: true
  - key: '<c-k>'
    context: 'files'
    description: 'Checkpoint: stash all (guarded, via bash checkpoint())'
    command: "bash -ic 'checkpoint'"
    subprocess: true
