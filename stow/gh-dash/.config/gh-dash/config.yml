# Config mínima de gh-dash. Ver: https://www.gh-dash.dev/configuration/
prSections:
  - title: My Pull Requests
    filters: "is:open author:@me"
  - title: Needs My Review
    filters: "is:open review-requested:@me"
  - title: Subscribed
    filters: "is:open -author:@me"

issuesSections:
  - title: Created
    filters: "is:open author:@me"
  - title: Assigned
    filters: "is:open assignee:@me"

defaults:
  prsLimit: 20
  issuesLimit: 20
  view: prs

# Catppuccin Mocha, accent blue (catppuccin/gh-dash) — misma variante que
# kitty/lazygit/atuin.
theme:
  colors:
    text:
      primary: "#cdd6f4"
      secondary: "#89b4fa"
      inverted: "#11111b"
      faint: "#bac2de"
      warning: "#f9e2af"
      success: "#a6e3a1"
      error: "#f38ba8"
    background:
      selected: "#313244"
    border:
      primary: "#89b4fa"
      secondary: "#45475a"
      faint: "#313244"
